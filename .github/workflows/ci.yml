name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check GitHub Pages artifact paths
        run: npm run test:pages

      - name: Lint
        run: npm run lint

      - name: Run deterministic API contract tests
        run: npm run test:unit

      - name: Check skill sync
        run: npm run test:skill-sync

      - name: Check Mercury retrograde coverage
        run: npm run test:mercury-dates
